name: Bug report
description: Report a reproducible defect in the kit, CLI, template, profile, or adapter contract.
title: "[Bug]: "
labels:
  - "type: bug"
  - "status: needs-triage"
body:
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - CLI or project scaffold
        - Manifest or shared contract
        - Profile or recommendation
        - Editor or document
        - Suggestion or review
        - Upload, download, or asset
        - Account or permission
        - Resource management
        - Publication or adapter
        - Skill or automation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kit version and project profile
      placeholder: 0.1.0-alpha.0 / manual-portal
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest repeatable sequence, fixture, and relevant revision.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: User impact
      description: Explain who is blocked or inconvenienced and how often it occurs.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, failing check, or public reproduction with secrets removed.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I removed secrets, private content, learner data, and personal information.
          required: true
